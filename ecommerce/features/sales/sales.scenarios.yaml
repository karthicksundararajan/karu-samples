scenarios:
- name: Customers can cancel their unpaid order
  given:
    Customers.Customer:
    - owner: dev:alice.dev
      name: Alice
      email: alice@example.test
      shipping:
        line1: Main 1
        city: Zurich
        postalCode: '8000'
        country: CH
    Catalogue.Category:
    - name: Equipment
      taxClass: Standard
    Catalogue.Product:
    - sku: SKU-1
      name: Mug
      category: Equipment
      price: '12.35'
      status: Active
    Catalogue.Stock:
    - product: SKU-1
      stockKey: STOCK-1
      onHand: 10
      reserved: 1
    Tax.Country:
    - code: CH
      name: Switzerland
      pricesIncludeVAT: true
    Tax.VatRate:
    - rateKey: CH:Standard
      country: CH
      taxClass: Standard
      rate: '8.10'
    Order:
    - owner: dev:alice.dev
      cartId: ORDER-1
      checkoutKey: order-1
      customer: dev:alice.dev
      shipping:
        line1: Main 1
        city: Zurich
        postalCode: '8000'
        country: CH
      pricesIncludeVAT: true
      subtotal: '12.35'
      totalExclVAT: '11.42'
      totalVAT: '0.93'
      total: '12.35'
      placedAt: '2026-11-22T12:00:00Z'
      expiresAt: '2026-11-22T12:30:00Z'
      status: PendingPayment
      lines:
      - product: SKU-1
        sku: SKU-1
        name: Mug
        taxClass: Standard
        vatRate: '8.10'
        unitPrice: '12.35'
        quantity: 1
        totalExclVAT: '11.42'
        totalVAT: '0.93'
        total: '12.35'
      vatBreakdown:
      - taxClass: Standard
        rate: '8.10'
        totalExclVAT: '11.42'
        totalVAT: '0.93'
        total: '12.35'
  when:
    command: CancelOrder
    'on': ORDER-1
    as:
      user: alice.dev
  expect:
    Order:
    - cartId: ORDER-1
      status: Cancelled
