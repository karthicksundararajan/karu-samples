types:
  Quantity: { type: int, min: 1, max: 1000000 }
  RequestKey: { type: string, max: 128 }
entities:
  Cart:
    aggregate: true
    fields:
      owner: { type: string, max: 300 }
      customer: Customers.Customer
      status: { type: enum, required: true, values: [Open, CheckedOut], default: Open }
      order: Order?
    children:
      lines: { entity: CartLine, readonlyWhen: { status: CheckedOut } }
    ownership: { field: owner, staff: [Support, Admin] }
  CartLine:
    fields:
      product: Catalogue.Product
      quantity: Quantity
  Order:
    aggregate: true
    fields:
      owner: { type: string, max: 300, required: true }
      cartId: { type: string, max: 30, unique: true }
      customer: Customers.Customer
      shipping: Customers.Address
      currency: { type: enum, required: true, values: [CHF], default: CHF }
      pricesIncludeVAT: { type: bool, required: true, renamedFrom: pricesIncludeVat }
      subtotal: Catalogue.Money
      totalExclVAT: { type: Catalogue.Money, required: true, renamedFrom: netTotal }
      totalVAT: { type: Catalogue.Money, required: true, renamedFrom: vatTotal }
      total: Catalogue.Money
      placedAt: datetime
      expiresAt: datetime
      status:
        type: enum
        required: true
        values: [PendingPayment, Paid, Shipped, Delivered, Cancelled, Expired, Replaced]
        default: PendingPayment
      carrier: { type: string, max: 100 }
      tracking: { type: string, max: 120 }
      replaces: Order?
      replacement: Order?
    children:
      lines: OrderLine
      vatBreakdown: OrderVat
    ownership: { field: owner, staff: [Support, Warehouse, Admin] }
  OrderLine:
    fields:
      product: Catalogue.Product
      sku: { type: string, max: 40, required: true }
      name: { type: string, max: 200, required: true }
      quantity: Catalogue.Units
      unitPrice: Catalogue.Money
      taxClass: Tax.TaxClass
      vatRate: Tax.Percent
      totalExclVAT: { type: Catalogue.Money, required: true, renamedFrom: net }
      totalVAT: { type: Catalogue.Money, required: true, renamedFrom: vat }
      total: Catalogue.Money
  OrderVat:
    fields:
      taxClass: Tax.TaxClass
      rate: Tax.Percent
      totalExclVAT: { type: Catalogue.Money, required: true, renamedFrom: net }
      totalVAT: { type: Catalogue.Money, required: true, renamedFrom: vat }
      total: { type: Catalogue.Money, required: true, renamedFrom: gross }
  Reservation:
    fields:
      order: Order
      stock: Catalogue.Stock
      quantity: Catalogue.Units
      status: { type: enum, required: true, values: [Held, Consumed, Released], default: Held }
  PaymentAttempt:
    fields:
      order: Order
      attemptKey: { type: string, max: 200, required: true, unique: true }
      kind: { type: enum, required: true, values: [Charge, Refund], default: Charge }
      amount: Catalogue.Money
      outcome: { type: enum, required: true, values: [Succeeded, Declined, TimedOut], default: Declined }
      reference: { type: string, max: 200 }
      at: datetime
    ownership: { via: order }
contracts:
  OpenCart:
    kind: commandHandler
    input: Cart
    data:
      queries:
      - Catalogue.ProductById
  ChangeCart:
    kind: commandHandler
    input: Cart
    data:
      queries:
      - Catalogue.ProductById
      - CartById
  PlaceOrder:
    kind: commandHandler
    input: Cart
    data:
      queries:
      - Customers.CustomerById
      - Catalogue.ProductById
      - Catalogue.StockByProduct
      - Catalogue.CategoryById
      - Tax.CountryByCode
      - Tax.VatRatesFor
      creates:
      - Order
      - Reservation
      commands:
      - Catalogue.ReserveStock
      - SealCart
  EditOrder:
    kind: commandHandler
    input: Order
    data:
      queries:
      - HeldReservations
      - Catalogue.ProductById
      - Catalogue.StockByProduct
      - Catalogue.CategoryById
      - Tax.CountryByCode
      - Tax.VatRatesFor
      creates:
      - Reservation
      commands:
      - Catalogue.ReserveStock
      - Catalogue.ReleaseStock
      - ReleaseReservation
  StartReplacement:
    kind: commandHandler
    input: Order
    data:
      queries:
      - Catalogue.StockByProduct
      - Tax.CountryByCode
      - Tax.VatRatesFor
      creates:
      - Order
      - Reservation
      commands:
      - Catalogue.ReserveStock
  TakePayment:
    kind: commandHandler
    input: Order
    data:
      creates:
      - PaymentAttempt
      commands:
      - ConfirmOrder
    uses:
    - Payments
  ConsumeReservations:
    kind: commandHandler
    input: Order
    data:
      queries:
      - HeldReservations
      commands:
      - Catalogue.ConsumeStock
      - ConsumeReservation
      - SupersedeOrder
  ReleaseReservations:
    kind: commandHandler
    input: Order
    data:
      queries:
      - HeldReservations
      commands:
      - Catalogue.ReleaseStock
      - ReleaseReservation
      - UnlinkReplacement
  ExpireReservations:
    kind: commandHandler
    input: Order
    data:
      queries:
      - HeldReservations
      commands:
      - Catalogue.ReleaseStock
      - ReleaseReservation
      - UnlinkReplacement
  ClearReplacement:
    kind: commandHandler
    input: Order
  SettleReplacedOrder:
    kind: commandHandler
    input: Order
    data:
      queries:
      - ConsumedReservations
      - PaymentByKey
      creates:
      - PaymentAttempt
      commands:
      - Catalogue.ReturnStock
    uses:
    - Payments
  RefundOrder:
    kind: commandHandler
    input: Order
    data:
      queries:
      - ConsumedReservations
      - PaymentByKey
      creates:
      - PaymentAttempt
      commands:
      - Catalogue.ReturnStock
    uses:
    - Payments
stateMachines:
  Cart.status:
    Open:
    - CheckedOut
  Order.status:
    PendingPayment:
    - Paid
    - Cancelled
    - Expired
    Paid:
    - Shipped
    - Cancelled
    - Replaced
    Shipped:
    - Delivered
  Reservation.status:
    Held:
    - Consumed
    - Released
commands:
  CreateCart:
    kind: create
    'on': Cart
    handler: OpenCart
  UpdateCart:
    kind: update
    'on': Cart
    handler: ChangeCart
    availableWhen:
      status: Open
  AddItem:
    'on': Cart
    handler: ChangeCart
    input:
      product: Catalogue.Product
      quantity: Quantity
    availableWhen:
      status: Open
  ChangeItem:
    'on': Cart
    handler: ChangeCart
    input:
      product: Catalogue.Product
      quantity: Quantity
      newProduct: Catalogue.Product?
    availableWhen:
      status: Open
  RemoveItem:
    'on': Cart
    handler: ChangeCart
    input:
      product: Catalogue.Product
    availableWhen:
      status: Open
  SealCart:
    'on': Cart
    transition:
      from: Open
      to: CheckedOut
  Checkout:
    'on': Cart
    handler: PlaceOrder
    idempotent: requestKey
    input:
      requestKey: RequestKey
    availableWhen:
      status: Open
  AddOrderItem:
    'on': Order
    handler: EditOrder
    input:
      product: Catalogue.Product
      quantity: Quantity
    availableWhen:
      status: PendingPayment
  ChangeOrderItem:
    'on': Order
    handler: EditOrder
    input:
      product: Catalogue.Product
      quantity: Quantity
      newProduct: Catalogue.Product?
    availableWhen:
      status: PendingPayment
  RemoveOrderItem:
    'on': Order
    handler: EditOrder
    input:
      product: Catalogue.Product
    availableWhen:
      status: PendingPayment
  ReplaceOrder:
    'on': Order
    handler: StartReplacement
    idempotent: requestKey
    input:
      requestKey: RequestKey
    availableWhen:
      all:
      - status: Paid
      - { field: replacement, op: isNull }
  PayOrder:
    'on': Order
    handler: TakePayment
    idempotent: attemptKey
    input:
      attemptKey: RequestKey
      method: { type: enum, required: true, values: [Success, Decline, Timeout], default: Success }
    availableWhen:
      status: PendingPayment
  ConfirmOrder:
    'on': Order
    handler: ConsumeReservations
    transition:
      from: PendingPayment
      to: Paid
  CancelOrder:
    'on': Order
    handler: ReleaseReservations
    transition:
      from: PendingPayment
      to: Cancelled
  ExpireOrder:
    'on': Order
    handler: ExpireReservations
    transition:
      from: PendingPayment
      to: Expired
  CancelPaidOrder:
    'on': Order
    handler: RefundOrder
    transition:
      from: Paid
      to: Cancelled
    availableWhen:
      field: replacement
      op: isNull
  SupersedeOrder:
    'on': Order
    handler: SettleReplacedOrder
    transition:
      from: Paid
      to: Replaced
  UnlinkReplacement:
    'on': Order
    handler: ClearReplacement
    input:
      replacement: Order
  ConsumeReservation:
    'on': Reservation
    transition:
      from: Held
      to: Consumed
  ReleaseReservation:
    'on': Reservation
    transition:
      from: Held
      to: Released
  ShipOrder:
    'on': Order
    input:
      carrier: { type: string, max: 100, required: true }
      tracking: { type: string, max: 120, required: true }
    transition:
      from: Paid
      to: Shipped
    availableWhen:
      field: replacement
      op: isNull
    sets:
      carrier: $input.carrier
      tracking: $input.tracking
  DeliverOrder:
    'on': Order
    transition:
      from: Shipped
      to: Delivered
queries:
  OrderPayments:
    from: PaymentAttempt
    select: [id, kind, outcome, amount, reference, at]
    params: { orderId: { ref: Order, required: true } }
    where: { order: { param: orderId } }
    orderBy: [id]
  CartById:
    from: Cart
    select:
    - id
    params:
      cartId:
        type: int
        required: true
    where:
      id:
        param: cartId
  HeldReservations:
    from: Reservation
    select:
    - id
    params:
      orderId:
        ref: Order
        required: true
    where:
      all:
      - order:
          param: orderId
      - status: Held
    orderBy:
    - id
  ConsumedReservations:
    from: Reservation
    select:
    - id
    params:
      orderId:
        ref: Order
        required: true
    where:
      all:
      - order:
          param: orderId
      - status: Consumed
    orderBy:
    - id
  PaymentByKey:
    from: PaymentAttempt
    select:
    - id
    params:
      key:
        type: string
        required: true
    where:
      attemptKey:
        param: key
    orderBy:
    - id
  PendingOrders:
    from: Order
    select:
    - id
    - expiresAt
    where:
      status: PendingPayment
    orderBy:
    - id
  MyOrders:
    from: Order
    select:
    - id
    - total
    - currency
    - status
    - placedAt
    orderBy:
    - field: id
      dir: desc
permissions:
  AddItem:
  - Customer
  ChangeItem:
  - Customer
  RemoveItem:
  - Customer
  SealCart:
  - System
  Checkout:
  - Customer
  AddOrderItem:
  - Customer
  ChangeOrderItem:
  - Customer
  RemoveOrderItem:
  - Customer
  ReplaceOrder:
  - Customer
  - Support
  - Admin
  PayOrder:
  - Customer
  ConfirmOrder:
  - System
  CancelOrder:
  - Customer
  - Support
  - Admin
  CancelPaidOrder:
  - Customer
  - Support
  - Admin
  ExpireOrder:
  - System
  SupersedeOrder:
  - System
  UnlinkReplacement:
  - System
  ConsumeReservation:
  - System
  ReleaseReservation:
  - System
  ShipOrder:
  - Warehouse
  - Admin
  DeliverOrder:
  - Warehouse
  - Admin
  Cart:
    read:
    - Customer
    - Support
    - Admin
    create:
    - Customer
    update:
    - Customer
  Order:
    read:
    - Customer
    - Support
    - Warehouse
    - Admin
  Reservation:
    read:
    - Warehouse
    - Admin
  PaymentAttempt:
    read:
    - Customer
    - Support
    - Admin
ports:
  Payments:
    kind: connector
    operations:
      Charge:
        input:
          key: string
          amount: decimal
          method: string
        output:
          outcome: string
          reference: string
      Refund:
        input:
          key: string
          amount: decimal
        output:
          outcome: string
          reference: string
