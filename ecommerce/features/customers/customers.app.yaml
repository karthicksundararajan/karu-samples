valueObjects:
  Address:
    fields:
      line1: { type: string, max: 200, required: true }
      city: { type: string, max: 120, required: true }
      postalCode: { type: string, max: 20, required: true }
      country: { type: string, max: 2, required: true }
entities:
  Customer:
    fields:
      owner: { type: string, max: 300, unique: true }
      name: { type: string, max: 120, required: true }
      email: { type: string, max: 200, required: true }
      shipping: Address
    ownership: { field: owner, staff: [Support, Admin] }
queries:
  CustomerById:
    from: Customer
    select: [id]
    params:
      customerId: { type: int, required: true }
    where:
      id: { param: customerId }
permissions:
  Customer: { read: [Customer, Support, Admin], create: [Customer], update: [Customer] }
